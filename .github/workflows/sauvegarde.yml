# Sauvegarde chiffrée de la base Supabase (comptes, collections, messages, fan arts…), chaque dimanche à 03 h 41 UTC.
# La sauvegarde est chiffrée (GPG, mot de passe) avant d'être rangée dans GitHub pendant 90 jours :
# onglet Actions → « Sauvegarde » → dernière exécution → « Artifacts ».
# À configurer une fois (Settings → Secrets and variables → Actions → New repository secret) :
#   SUPABASE_DB_URL    : Supabase → Project Settings → Database → Connection string (URI, « Session pooler »), avec le mot de passe
#   BACKUP_PASSPHRASE  : une phrase secrète longue, à garder précieusement (sans elle, la sauvegarde est illisible)
# Restaurer : gpg -d sauvegarde.sql.gz.gpg | gunzip | psql "<adresse de la base>"
name: Sauvegarde
on:
  schedule:
    - cron: "41 3 * * 0"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Vérification de la configuration
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB" ] || [ -z "$PASS" ]; then
            echo "::error::Ajoute les secrets SUPABASE_DB_URL et BACKUP_PASSPHRASE (voir l'en-tête de ce fichier)."; exit 1
          fi
      - name: Outils PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: Export et chiffrement
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -o pipefail
          /usr/lib/postgresql/17/bin/pg_dump "$DB" --no-owner --no-privileges --schema=public --schema=auth --schema=storage \
            | gzip -9 | gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" --symmetric --cipher-algo AES256 -o sauvegarde.sql.gz.gpg
          ls -lh sauvegarde.sql.gz.gpg
      - uses: actions/upload-artifact@v4
        with:
          name: sauvegarde-${{ github.run_number }}
          path: sauvegarde.sql.gz.gpg
          retention-days: 90
